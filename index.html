<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2EDE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>這餐吃什麼</title>
<style>
:root{
  --paper:#FAF8F5; --ink:#2A2622; --line:rgba(42,38,34,.18);
  --ground:#F2EDE7; --ground-2:#E9E1D7;
  --accent:#A8896E; --accent-strong:#4A3528; --accent-soft:#D8C9B8;
  --font-cjk:"Source Han Sans TC","Noto Sans TC","PingFang TC",sans-serif;
  --font-latin:Calibri,"Segoe UI",Arial,sans-serif;
  --radius:6px; --pill:999px;
  --shadow-soft:0 6px 20px rgba(42,38,34,.07);
  --ease:cubic-bezier(.33,0,.2,1); --dur:240ms;
  --tap:46px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--ground)}
body{background:var(--ground);color:var(--ink);font-family:var(--font-cjk);
  line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased;
  padding:22px 18px 0;overscroll-behavior-y:contain}
.wrap{max-width:520px;margin:0 auto;padding-bottom:8px}

/* ── 頁首 ───────────────────────── */
header{text-align:center;margin-bottom:20px}
h1{font-size:25px;font-weight:900;letter-spacing:.2em;color:var(--accent-strong);
  text-indent:.2em;line-height:1.4}
.count{margin-top:4px;font-size:12.5px;color:var(--accent)}
.count b{color:var(--accent-strong);font-weight:700;font-family:var(--font-latin);
  font-size:15px;letter-spacing:.02em}

/* ── 模式切換 ───────────────────── */
.tabs{display:flex;gap:6px;border:1px solid var(--line);border-radius:var(--pill);
  padding:4px;background:var(--paper);margin-bottom:20px}
.tab{flex:1;min-height:40px;border:0;background:transparent;color:var(--accent);
  border-radius:var(--pill);font-size:14px;letter-spacing:.14em;text-indent:.14em;
  font-family:var(--font-cjk);cursor:pointer;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.tab.on{background:var(--accent-strong);color:var(--paper);font-weight:700}
.pane{display:none}
.pane.on{display:block}

/* ── 清單 ───────────────────────── */
.sorts{display:flex;gap:7px;margin-bottom:12px;align-items:center;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.sorts::-webkit-scrollbar{display:none}
.sorts .lb{font-size:10.5px;letter-spacing:.18em;color:var(--accent);flex:none}
.sort{flex:none;white-space:nowrap;min-height:34px;border:1px solid var(--line);
  border-radius:var(--pill);padding:0 14px;font-size:12.5px;color:var(--accent);
  background:transparent;font-family:var(--font-cjk);cursor:pointer;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.sort.on{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--paper)}
.list{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);
  overflow:hidden;margin-bottom:20px}
.li{display:block;padding:14px 16px;border-bottom:1px solid var(--accent-soft);
  text-decoration:none;color:var(--ink);transition:background var(--dur) var(--ease)}
.li:last-child{border-bottom:0}
.li:active{background:var(--ground-2)}
.li-top{display:flex;align-items:baseline;gap:8px}
.li-n{font-size:15.5px;font-weight:700;color:var(--accent-strong);line-height:1.45;
  flex:1;word-break:break-word}
.li-cat{flex:none;font-size:10.5px;letter-spacing:.14em;color:var(--accent)}
.li-sub{font-size:12.5px;color:var(--accent);line-height:1.7;margin-top:2px}
.li-sub em{font-style:normal;color:var(--accent-strong)}
.li.closed .li-n{color:var(--accent)}
.li-sig{font-size:12.5px;color:var(--accent);line-height:1.6}

/* ── 結果卡 ─────────────────────── */
.result{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);
  box-shadow:var(--shadow-soft);padding:26px 20px 22px;margin-bottom:22px;display:none}
.result.show{display:block;animation:rise var(--dur) var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.r-cat{font-size:10.5px;letter-spacing:.24em;color:var(--accent);margin-bottom:9px}
.r-name{font-size:27px;font-weight:900;letter-spacing:.04em;color:var(--accent-strong);
  line-height:1.32;word-break:break-word;min-height:36px}
.r-name.rolling{opacity:.45}
.r-sig{font-size:14px;color:var(--accent);margin-top:7px;line-height:1.6}
.r-axes{display:flex;border-top:1px solid var(--accent-soft);
  border-bottom:1px solid var(--accent-soft);margin:20px 0 16px}
.r-ax{flex:1;padding:13px 2px;text-align:center;border-right:1px solid var(--accent-soft)}
.r-ax:last-child{border-right:0}
.r-ax-k{font-size:10.5px;letter-spacing:.18em;color:var(--accent);margin-bottom:3px}
.r-ax-v{font-size:14.5px;font-weight:700;color:var(--accent-strong);letter-spacing:.03em}
.r-ax-n{font-size:10.5px;color:var(--accent);font-family:var(--font-latin);letter-spacing:.06em}
.r-row{display:flex;gap:12px;padding:6px 0;font-size:13.5px;line-height:1.65}
.r-k{flex:none;width:42px;color:var(--accent);font-size:12px;letter-spacing:.1em}
.r-v{flex:1;color:var(--ink);word-break:break-word}
.flag{display:inline-block;border:1px solid var(--accent-soft);border-radius:var(--pill);
  padding:2px 11px;font-size:11.5px;color:var(--accent);margin:0 5px 5px 0}
.flag.hot{border-color:var(--accent-strong);color:var(--accent-strong)}
.r-acts{display:flex;gap:9px;margin-top:18px}
.act{flex:1;min-height:var(--tap);border:1px solid var(--accent);background:transparent;
  color:var(--accent-strong);border-radius:var(--pill);font-size:14px;letter-spacing:.1em;
  cursor:pointer;font-family:var(--font-cjk);text-decoration:none;
  display:flex;align-items:center;justify-content:center;
  transition:background var(--dur) var(--ease)}
.act:active{background:var(--ground-2)}

.empty{display:none;text-align:center;padding:34px 18px;margin-bottom:22px;
  border:1px dashed var(--accent-soft);border-radius:var(--radius);
  color:var(--accent);font-size:13.5px;line-height:1.9}
.empty.show{display:block}
.hint{text-align:center;color:var(--accent);font-size:13px;line-height:1.9;
  padding:24px 10px 30px}
.hint.hide{display:none}

/* ── 面板 ───────────────────────── */
.panel{border:1px solid var(--line);border-radius:var(--radius);
  background:var(--paper);padding:20px 18px;margin-bottom:14px}

/* ── 軸線 ───────────────────────── */
.axis{margin-bottom:22px}
.axis:last-child{margin-bottom:2px}
.axis-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  margin-bottom:2px}
.axis-name{font-size:14.5px;font-weight:700;letter-spacing:.12em;color:var(--accent-strong);
  flex:none}
.axis-val{font-size:12.5px;color:var(--accent);text-align:right}
.axis-val b{color:var(--accent-strong);font-weight:700;font-family:var(--font-latin);
  font-size:14px;margin-right:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:38px;
  background:transparent;cursor:pointer;display:block;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--accent-soft);
  border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:var(--accent-soft);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;
  border-radius:var(--pill);background:var(--accent-strong);margin-top:-12px;
  border:3px solid var(--paper);box-shadow:0 1px 4px rgba(42,38,34,.22)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:3px solid var(--paper);
  border-radius:var(--pill);background:var(--accent-strong);box-shadow:0 1px 4px rgba(42,38,34,.22)}
.ticks{display:flex;font-size:10.5px;color:var(--accent);font-family:var(--font-latin);
  margin-top:-6px}
.ticks span{flex:1;text-align:center}
.ticks span:first-child{text-align:left}
.ticks span:last-child{text-align:right}
.ticks span.on{color:var(--accent-strong);font-weight:700}

/* ── 膠囊 ───────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{min-height:38px;border:1px solid var(--line);border-radius:var(--pill);
  padding:0 15px;font-size:13.5px;letter-spacing:.05em;color:var(--accent);
  background:transparent;cursor:pointer;font-family:var(--font-cjk);
  display:inline-flex;align-items:center;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease),
             border-color var(--dur) var(--ease)}
.chip.on{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--paper)}
.chip .n{font-family:var(--font-latin);font-size:11px;opacity:.65;margin-left:5px}
.chip-label{font-size:10.5px;letter-spacing:.2em;color:var(--accent);margin-bottom:9px}
.chip-group{margin-bottom:16px}
.chip-group:last-child{margin-bottom:0}

/* ── 收合區 ─────────────────────── */
details{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);
  margin-bottom:14px;overflow:hidden}
summary{min-height:var(--tap);display:flex;align-items:center;padding:0 18px;
  font-size:13px;letter-spacing:.16em;color:var(--accent);cursor:pointer;
  list-style:none;outline:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";margin-left:auto;font-family:var(--font-latin);font-size:15px}
details[open] summary::after{content:"−"}
details[open] summary{border-bottom:1px solid var(--accent-soft)}
.det-body{padding:16px 18px 18px}

/* ── 時段選擇 ───────────────────── */
.when{margin-bottom:14px}
.wrow{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;margin-bottom:8px;padding-bottom:2px}
.wrow::-webkit-scrollbar{display:none}
.wchip{flex:none;white-space:nowrap;min-height:34px;border:1px solid var(--line);
  border-radius:var(--pill);padding:0 13px;font-size:13px;color:var(--accent);
  background:transparent;font-family:var(--font-cjk);cursor:pointer;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.wchip.on{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--paper)}
.whint{font-size:11.5px;color:var(--accent);line-height:1.7;margin:2px 0 6px}
.whint b{color:var(--accent-strong);font-weight:700}

.opt{display:flex;align-items:center;gap:11px;min-height:var(--tap);
  font-size:14px;color:var(--ink);cursor:pointer}
.opt input{appearance:none;-webkit-appearance:none;width:21px;height:21px;flex:none;
  border:1px solid var(--accent);border-radius:3px;cursor:pointer;position:relative;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.opt input:checked{background:var(--accent-strong);border-color:var(--accent-strong)}
.opt input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:11px;
  border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(42deg)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.14em;color:var(--accent);
  font-weight:400;padding:7px 6px;border-bottom:1px solid var(--accent-soft)}
td{padding:8px 6px;border-bottom:1px dotted var(--accent-soft);vertical-align:top}
td.num{font-family:var(--font-latin);color:var(--accent);white-space:nowrap;font-size:12px}
tr.dim td{opacity:.4}

/* ── 底部擲骰列 ─────────────────── */
.rollbar{position:sticky;bottom:0;z-index:9;
  padding:14px 0 calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--ground) 62%,rgba(242,237,231,0))}
.roll{width:100%;min-height:54px;border:0;background:var(--accent-strong);color:var(--paper);
  border-radius:var(--pill);font-size:17px;font-weight:700;letter-spacing:.28em;
  text-indent:.28em;cursor:pointer;font-family:var(--font-cjk);
  box-shadow:0 4px 14px rgba(42,38,34,.16);
  transition:background var(--dur) var(--ease),opacity var(--dur) var(--ease)}
.roll:active{background:var(--accent)}
.roll:disabled{opacity:.4}

.foot{font-size:11px;color:var(--accent);line-height:1.85;padding:6px 2px 26px}

/* ── 位置 ───────────────────────── */
.chip:disabled{opacity:.4;cursor:default}
.loc-status{font-size:11.5px;color:var(--accent);line-height:1.8;margin-top:12px}
.loc-status b{color:var(--accent-strong);font-weight:700}
.loc-status.err{color:var(--accent-strong)}
.axis.off{opacity:.38}
.axis.off input{pointer-events:none}

@media(min-width:560px){
  body{padding-top:38px}
  h1{font-size:29px}
  .r-name{font-size:31px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>這餐吃什麼</h1>
  <div class="count">符合條件 <b id="cnt">0</b> 家</div>
</header>

<div class="tabs">
  <button class="tab on" id="tab-dice">擲 骰 子</button>
  <button class="tab" id="tab-list">全 部 列 出</button>
</div>

<div class="pane on" id="pane-dice">

<section class="result" id="result">
  <div class="r-cat" id="r-cat"></div>
  <div class="r-name" id="r-name"></div>
  <div class="r-sig" id="r-sig"></div>
  <div class="r-axes">
    <div class="r-ax"><div class="r-ax-k">距 離</div><div class="r-ax-v" id="r-dist"></div><div class="r-ax-n" id="r-dist-n"></div></div>
    <div class="r-ax"><div class="r-ax-k">濃 淡</div><div class="r-ax-v" id="r-flav"></div><div class="r-ax-n" id="r-flav-n"></div></div>
    <div class="r-ax"><div class="r-ax-k">價 格</div><div class="r-ax-v" id="r-price"></div><div class="r-ax-n" id="r-price-n"></div></div>
  </div>
  <div id="r-rows"></div>
  <div class="r-acts">
    <button class="act" id="reroll">換 一 家</button>
    <a class="act" id="map" target="_blank" rel="noopener">開 地 圖</a>
  </div>
</section>

<div class="empty" id="empty">
  這組條件下沒有店。<br>把距離或價格往右調一格，或多選一個分類。
</div>

<div class="hint" id="hint">按下面的按鈕，隨機挑一家</div>

</div><!-- /pane-dice -->

<div class="pane" id="pane-list">
  <div class="sorts">
    <span class="lb">排 序</span>
    <button class="sort on" data-s="dist">近的先</button>
    <button class="sort" data-s="price">便宜先</button>
    <button class="sort" data-s="flav">清淡先</button>
    <button class="sort" data-s="open">有開的先</button>
  </div>
  <div class="list" id="list"></div>
</div>

<section class="panel">
  <div class="chip-group">
    <div class="chip-label">從 哪 裡 出 發</div>
    <div class="chips">
      <button class="chip on" id="org-home">住家</button>
      <button class="chip" id="org-here">我現在的位置</button>
    </div>
  </div>
  <div class="chip-group">
    <div class="chip-label">挑 哪 些 店</div>
    <div class="chips">
      <button class="chip on" id="src-list">精選名單</button>
      <button class="chip" id="src-near" disabled>附近所有店</button>
    </div>
  </div>
  <div class="loc-status" id="loc-status"></div>
</section>

<section class="panel">
  <div class="axis" id="axw-dist">
    <div class="axis-head">
      <span class="axis-name">距離</span>
      <span class="axis-val" id="lab-dist"></span>
    </div>
    <input type="range" id="ax-dist" min="1" max="5" step="1" value="5">
    <div class="ticks" id="tk-dist"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
  </div>
  <div class="axis" id="axw-flav">
    <div class="axis-head">
      <span class="axis-name">濃淡</span>
      <span class="axis-val" id="lab-flav"></span>
    </div>
    <input type="range" id="ax-flav" min="1" max="5" step="1" value="5">
    <div class="ticks" id="tk-flav"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
  </div>
  <div class="axis" id="axw-price">
    <div class="axis-head">
      <span class="axis-name">價格</span>
      <span class="axis-val" id="lab-price"></span>
    </div>
    <input type="range" id="ax-price" min="1" max="5" step="1" value="5">
    <div class="ticks" id="tk-price"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
  </div>
</section>

<section class="panel">
  <div class="chip-group">
    <div class="chip-label">正 餐</div>
    <div class="chips" id="cats-meal"></div>
  </div>
  <div class="chip-group">
    <div class="chip-label">飯 後 與 夜 場</div>
    <div class="chips" id="cats-extra"></div>
  </div>
</section>

<details>
  <summary>更 多 條 件</summary>
  <div class="det-body">
    <div class="when">
      <div class="chip-label">什 麼 時 候 吃</div>
      <div class="wrow" id="days"></div>
      <div class="wrow" id="slots"></div>
      <div class="whint" id="whint"></div>
      <label class="opt"><input type="checkbox" id="op-open"><span>只挑這個時段有開的</span></label>
    </div>
    <label class="opt"><input type="checkbox" id="op-new"><span>只挑沒去過的（冒險）</span></label>
    <label class="opt"><input type="checkbox" id="op-quick"><span>避開要排隊或要預約的</span></label>
    <label class="opt"><input type="checkbox" id="op-ch"><span>避開千蕙不愛的</span></label>
    <label class="opt"><input type="checkbox" id="op-risk" checked><span>排除歇業與狀態存疑</span></label>
  </div>
</details>

<details>
  <summary>資 料 說 明</summary>
  <div class="det-body"><div class="foot" id="foot" style="padding:0"></div></div>
</details>

<div class="rollbar" id="rollbar">
  <button class="roll" id="roll">擲 骰 子</button>
</div>

</div>

/** 附近搜尋的店名、地址來自外部社群資料，塞進 innerHTML 前一律跳脫。 */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/** 旗標上的時間詞：預設時段就說「現在」，選了別的時段就說「那時」。 */
function whenWord(){
  return (S.day === "today" && S.slot === "now") ? "現在" : "那時";
}

function mapUrl(p){
  if(p.osm && !p.addr)
    return "https://www.google.com/maps/search/" + encodeURIComponent(p.n) +
           "/@" + p.lat + "," + p.lng + ",18z";
  return "https://www.google.com/maps/search/?api=1&query=" +
         encodeURIComponent(p.addr ? p.n + " " + p.addr : p.n + " 台南");
}
const MEAL = META.mealCats, EXTRA = META.extraCats;

/* ══ 分類膠囊 ══════════════════════════════ */
function buildChips(){
  const mk = (host, list) => {
    host.innerHTML = "";
    list.forEach(c => {
      const n = ACTIVE.filter(p => p.cat === c).length;
      const b = document.createElement("button");
      b.className = "chip" + (S.cats.has(c) ? " on" : "");
      b.innerHTML = c + '<span class="n">' + n + '</span>';
      b.onclick = () => { S.cats.has(c) ? S.cats.delete(c) : S.cats.add(c); buildChips(); refresh(); };
      host.appendChild(b);
    });
  };
  mk($("cats-meal"), MEAL);
  mk($("cats-extra"), EXTRA);
}

/* ══ 營業時間 ══════════════════════════════ */
const DAY_NAMES = ["日","一","二","三","四","五","六"];
const SLOTS = [["now","現在",null],["b","早餐",8*60],["l","午餐",12*60],
               ["a","下午",15*60],["d","晚餐",18*60+30],["n","宵夜",21*60+30]];

function target(){
  const now = new Date();
  const wd = S.day === "today" ? now.getDay() : S.day;
  const slot = SLOTS.find(s => s[0] === S.slot);
  const mins = slot[2] === null ? now.getHours()*60 + now.getMinutes() : slot[2];
  return {wd, mins};
}

/** 回傳 true／false／null（未確認）。approx 的時段回傳 "maybe"。 */
function openAt(p, wd, mins){
  if(!p.hrs || !p.hrs.length) return null;
  if(p.off && p.off.includes(wd)) return false;
  const fits = p.hrs.filter(r => !r.d || r.d.includes(wd));
  if(!fits.length) return false;
  let hit = null;
  for(const r of fits){
    const end = r.e <= r.s ? r.e + 1440 : r.e;
    const ok = (mins >= r.s && mins <= end) || (mins + 1440 >= r.s && mins + 1440 <= end);
    if(ok){ if(!r.a) return true; hit = "maybe"; }
  }
  return hit || false;
}

function openNow(p){
  const t = target();
  return openAt(p, t.wd, t.mins);
}

/* ══ 篩選 ══════════════════════════════════ */
function filter(){
  return ACTIVE.filter(p => {
    if(!S.cats.has(p.cat)) return false;
    if(p.dist > S.dist || p.flav > S.flav || p.price > S.price) return false;
    if($("op-risk").checked && p.risk) return false;
    if($("op-new").checked && p.been) return false;
    if($("op-ch").checked && p.noCH) return false;
    if($("op-quick").checked && (p.queue || p.book)) return false;
    if($("op-open").checked && openNow(p) === false) return false;
    return true;
  });
}

function refresh(){
  S.pool = filter();
  $("cnt").textContent = S.pool.length;
  $("roll").disabled = S.pool.length === 0;
  $("empty").classList.toggle("show", S.pool.length === 0);
  if(S.pool.length === 0){ $("result").classList.remove("show"); $("hint").classList.add("hide"); }
  renderList();
}

/* ══ 時段選擇 ══════════════════════════════ */
function buildWhen(){
  const dh = $("days"), sh = $("slots");
  dh.innerHTML = ""; sh.innerHTML = "";
  const mk = (host, label, on, fn) => {
    const b = document.createElement("button");
    b.className = "wchip" + (on ? " on" : "");
    b.textContent = label;
    b.onclick = fn;
    host.appendChild(b);
  };
  mk(dh, "今天", S.day === "today", () => { S.day = "today"; afterWhen(); });
  [1,2,3,4,5,6,0].forEach(i =>                       // 台灣習慣從週一排到週日
    mk(dh, DAY_NAMES[i], S.day === i, () => { S.day = i; afterWhen(true); }));
  SLOTS.forEach(s =>
    mk(sh, s[1], S.slot === s[0], () => { S.slot = s[0]; afterWhen(s[0] !== "now"); }));
  // 選中的膠囊捲進視野，否則按了以後看不到自己選了什麼
  [dh, sh].forEach(host => {
    const on = host.querySelector(".wchip.on");
    if(on) host.scrollLeft = on.offsetLeft - host.clientWidth / 2 + on.offsetWidth / 2;
  });
  const t = target();
  const hh = String(Math.floor(t.mins / 60)).padStart(2, "0");
  const mm = String(t.mins % 60).padStart(2, "0");
  const isWeekend = t.wd === 0 || t.wd === 6;
  $("whint").innerHTML = "看的是 <b>週" + DAY_NAMES[t.wd] + " " + hh + ":" + mm + "</b>"
    + (isWeekend ? "（假日時段）" : "") + "，勾下面那項才會真的篩掉沒開的店。";
}

/** 選了非「今天／現在」就自動把篩選打開，否則畫面不會有反應。 */
function afterWhen(autoCheck){
  if(autoCheck) $("op-open").checked = true;
  buildWhen();
  refresh();
}

/* ══ 全部列出 ══════════════════════════════ */
function sorted(){
  const orank = p => { const o = openNow(p);
    return o === true ? 0 : o === "maybe" ? 1 : o === null ? 2 : 3; };
  const rank = {dist:p => [p.dist, p.min == null ? 999 : p.min, p.price],
                price:p => [p.price, p.avg == null ? 9999 : p.avg, p.dist],
                flav:p => [p.flav, p.dist, p.price],
                open:p => [orank(p), p.dist, p.price]};
  const k = rank[S.sort];
  return S.pool.slice().sort((a,b) => {
    const x = k(a), y = k(b);
    for(let i = 0; i < x.length; i++) if(x[i] !== y[i]) return x[i] - y[i];
    return a.n.localeCompare(b.n, "zh-Hant");
  });
}

function renderList(){
  const host = $("list");
  host.innerHTML = "";
  sorted().forEach(p => {
    const on = openNow(p);
    const a = document.createElement("a");
    a.className = "li" + (on === false ? " closed" : "");
    a.href = mapUrl(p);
    a.target = "_blank";
    a.rel = "noopener";
    const bits = [];
    bits.push(minTxt(p) || "距離未知");
    bits.push(p.avg ? (p.est ? "約 $" : "$") + p.avg : "價位未知");
    if(p.flav) bits.push(AX.flav.one[p.flav-1]);
    if(on === true) bits.push("<em>" + whenWord() + "有開</em>");
    else if(on === "maybe") bits.push("<em>應該有開</em>");
    else if(on === false) bits.push(whenWord() + "沒開");
    if(p.been === false) bits.push("<em>沒去過</em>");
    if(p.queue) bits.push("要排隊");
    if(p.book) bits.push("要預約");
    a.innerHTML = '<div class="li-top"><span class="li-n">' + esc(p.n)
      + '</span><span class="li-cat">' + esc(p.cat) + '</span></div>'
      + (p.sig ? '<div class="li-sig">' + esc(p.sig) + '</div>' : '')
      + '<div class="li-sub">' + bits.join(" ・ ") + '</div>';
    host.appendChild(a);
  });
}

function setMode(m){
  S.mode = m;
  $("tab-dice").classList.toggle("on", m === "dice");
  $("tab-list").classList.toggle("on", m === "list");
  $("pane-dice").classList.toggle("on", m === "dice");
  $("pane-list").classList.toggle("on", m === "list");
  $("rollbar").style.display = m === "dice" ? "" : "none";
  if(m === "list") renderList();
}

/* ══ 軸線 UI ═══════════════════════════════ */
function bindAxis(key, inp, lab, tk){
  const upd = () => {
    S[key] = +inp.value;
    lab.innerHTML = '<b>' + S[key] + '</b>' + AX[key].labs[S[key]-1];
    [...tk.children].forEach((s,i) => s.classList.toggle("on", i+1 === S[key]));
    refresh();
    if(key === "dist" && S.src === "near") queueNear();
  };
  inp.oninput = upd;
  upd();
}

/* ══ 擲骰 ══════════════════════════════════ */
function pick(excludeLast){
  let pool = S.pool;
  if(excludeLast && S.last && pool.length > 1) pool = pool.filter(p => p.n !== S.last.n);
  return pool[Math.floor(Math.random() * pool.length)];
}

function roll(excludeLast){
  if(S.rolling || !S.pool.length) return;
  S.rolling = true;
  const target = pick(excludeLast);
  const nameEl = $("r-name");
  $("hint").classList.add("hide");
  $("result").classList.add("show");
  nameEl.classList.add("rolling");
  if(navigator.vibrate) navigator.vibrate(12);
  let t = 0;
  const iv = setInterval(() => {
    nameEl.textContent = S.pool[Math.floor(Math.random() * S.pool.length)].n;
    if(++t > 11){
      clearInterval(iv);
      nameEl.classList.remove("rolling");
      show(target);
      S.rolling = false;
      if(navigator.vibrate) navigator.vibrate([0,18]);
      window.scrollTo({top:0, behavior:"smooth"});
    }
  }, 55);
}

function show(p){
  S.last = p;
  $("r-cat").textContent = p.cat.split("").join(" ");
  $("r-name").textContent = p.n;
  $("r-sig").textContent = p.sig || "";
  $("r-dist").textContent = AX.dist.one[p.dist-1];
  $("r-dist-n").textContent = minTxt(p);
  $("r-flav").textContent = p.flav ? AX.flav.one[p.flav-1] : "未知";
  $("r-flav-n").textContent = "";
  $("r-price").textContent = p.price ? AX.price.one[p.price-1] : "未知";
  $("r-price-n").textContent = p.avg ? (p.est ? "約 $" : "$") + p.avg : "價位未知";

  const flags = [];
  const on = openNow(p);
  if(on === true) flags.push([whenWord() + "有開", true]);
  else if(on === "maybe") flags.push(["應該有開", true]);
  else if(on === false) flags.push([whenWord() + "沒開", false]);
  else flags.push(["營業時間未確認", false]);
  if(p.queue) flags.push(["要排隊", false]);
  if(p.book) flags.push(["要預約", false]);
  if(p.been === false) flags.push(["還沒去過", true]);
  if(p.osm) flags.push(["非精選・資料較少", false]);
  if(p.risk) flags.push(["狀態待確認", false]);

  const rows = [];
  if(flags.length) rows.push(["", flags.map(f =>
    '<span class="flag' + (f[1] ? " hot" : "") + '">' + f[0] + '</span>').join("")]);
  if(p.addr) rows.push(["地址", esc(p.addr)]);
  if(p.hrsTxt) rows.push(["時間", esc(p.hrsTxt + (p.offTxt && p.offTxt !== "無" ? "（休 " + p.offTxt + "）" : ""))]);
  $("r-rows").innerHTML = rows.map(r =>
    '<div class="r-row"><div class="r-k">' + r[0] + '</div><div class="r-v">' + r[1] + '</div></div>').join("");

  $("map").href = mapUrl(p);
}

/* ══ 位置與距離 ════════════════════════════ */
const ROAD = 1.35, KMH = 16;                 // 與資料說明同一組換算
const GRADE_MIN = [5, 10, 15, 25];           // 距離檔位分界（分鐘）
const NEAR_R = [1000, 2000, 3000];           // 附近搜尋半徑（公尺），對應距離第 1-3 檔
const OVERPASS = ["https://overpass-api.de/api/interpreter",
                  "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
                  "https://overpass.kumi.systems/api/interpreter",
                  "https://overpass.private.coffee/api/interpreter"];
DATA.forEach(p => { p.home = {km:p.km, min:p.min, dist:p.dist}; });
let ACTIVE = DATA, NEAR = [];
const near = {pos:null, r:0, seq:0, timer:null, prevDist:null};

function straightKm(a, b){
  const rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng/2)**2;
  return 6371 * 2 * Math.asin(Math.sqrt(h));
}

/** 直線公里數 → 道路公里、車程分鐘、距離檔位。 */
function travel(straight){
  const km = Math.round(straight * ROAD * 10) / 10;
  const min = Math.max(1, Math.round(straight * ROAD / KMH * 60));
  let dist = GRADE_MIN.findIndex(g => min <= g) + 1;
  if(dist === 0) dist = 5;
  return {km, min, dist};
}

function minTxt(p){
  if(!p.min) return "";
  if(p.min < 90) return "約 " + p.min + " 分鐘";
  return "約 " + (Math.round(p.min / 6) / 10) + " 小時";
}

/** 依目前圓心重算每家店的距離；查不到座標的沿用原站做法，暫放第 3 檔。 */
function applyOrigin(){
  const here = S.origin === "here" && S.pos;
  DATA.forEach(p => {
    if(!here) Object.assign(p, p.home);
    else if(p.lat == null) Object.assign(p, {km:null, min:null, dist:3});
    else Object.assign(p, travel(straightKm(S.pos, p)));
  });
  if(S.pos) NEAR.forEach(p => Object.assign(p, travel(straightKm(S.pos, p))));
}

function setStatus(html, err){
  const el = $("loc-status");
  el.innerHTML = html;
  el.classList.toggle("err", !!err);
}

function syncLocUI(){
  $("org-home").classList.toggle("on", S.origin === "home");
  $("org-here").classList.toggle("on", S.origin === "here");
  $("src-list").classList.toggle("on", S.src === "list");
  $("src-near").classList.toggle("on", S.src === "near");
  $("src-near").disabled = !(S.origin === "here" && S.pos);
  $("axw-flav").classList.toggle("off", S.src === "near");
  $("axw-price").classList.toggle("off", S.src === "near");
}

function remember(v){ try{ localStorage.setItem("wte-origin", v); }catch(e){} }

function hereStatus(){
  const t = new Date(S.pos.t);
  const hm = String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");
  const within = DATA.filter(p => p.lat != null && p.dist <= 4).length;
  return "已定位（" + hm + "，誤差約 " + Math.round(S.pos.acc) + " 公尺）。精選名單 25 分鐘內有 <b>"
    + within + "</b> 家。再按一次「我現在的位置」可重新定位。";
}

/** 離開附近模式時，把當初自動收窄的距離還原（使用者自己動過就不還原）。 */
function restoreDist(){
  if(near.prevDist != null && S.dist === 2){
    $("ax-dist").value = near.prevDist;
    $("ax-dist").oninput();
  }
  near.prevDist = null;
}

function useHome(){
  const leaving = S.src === "near";
  S.origin = "home"; S.src = "list"; ACTIVE = DATA;
  if(leaving) restoreDist();
  remember("home");
  applyOrigin(); syncLocUI(); buildChips(); refresh();
  setStatus("距離以住家為圓心。按「我現在的位置」改用手機定位。");
}

function locate(){
  if(!window.isSecureContext || !navigator.geolocation){
    setStatus("這個瀏覽器或網址無法定位。請用 https 網址，並以 Safari 或 Chrome 開啟。", true);
    return;
  }
  setStatus("定位中，第一次會跳出權限詢問，請按允許。");
  navigator.geolocation.getCurrentPosition(pos => {
    S.pos = {lat:pos.coords.latitude, lng:pos.coords.longitude, acc:pos.coords.accuracy, t:Date.now()};
    S.origin = "here";
    remember("here");
    applyOrigin();
    const within = DATA.filter(p => p.lat != null && p.dist <= 4).length;
    if(within === 0 || S.src === "near"){
      setSrc("near", within === 0);
    } else {
      syncLocUI(); refresh();
      setStatus(hereStatus());
    }
  }, err => {
    const msg = err.code === 1
      ? "定位權限被拒絕。iPhone 到「設定 › 隱私權與安全性 › 定位服務」打開瀏覽器的定位；Android 點網址列左側圖示改成允許。"
      : err.code === 3 ? "定位逾時。到窗邊或室外再按一次。"
      : "目前抓不到位置。確認手機定位已開啟後再按一次。";
    setStatus(msg, true);
  }, {enableHighAccuracy:true, timeout:15000, maximumAge:60000});
}

function setSrc(src, auto){
  if(src === "near" && !(S.origin === "here" && S.pos)) return;
  // 剛進附近模式先收在 10 分鐘內，避免一次抓太大範圍（要在切換來源前調，才不會重複觸發搜尋）
  if(src === "near" && S.src !== "near" && S.dist > 2){
    near.prevDist = S.dist;
    $("ax-dist").value = 2;
    $("ax-dist").oninput();
  }
  const leaving = S.src === "near" && src !== "near";
  S.src = src;
  if(leaving) restoreDist();
  if(src === "list"){
    ACTIVE = DATA;
    syncLocUI(); buildChips(); refresh();
    setStatus(S.origin === "here" ? hereStatus() : "距離以住家為圓心。按「我現在的位置」改用手機定位。");
    return;
  }
  ACTIVE = NEAR;
  syncLocUI(); buildChips(); refresh();
  loadNear(auto);
}

/* ══ 附近所有店（OpenStreetMap）════════════ */
const CUISINE = {noodle:"麵", noodles:"麵", coffee_shop:"咖啡", bubble_tea:"手搖飲", chicken:"雞肉料理",
  japanese:"日式", regional:"在地料理", local:"在地料理", chinese:"中式", steak_house:"牛排", steak:"牛排",
  breakfast:"早餐", sandwich:"三明治", asian:"亞洲料理", burger:"漢堡", thai:"泰式", juice:"果汁",
  sushi:"壽司", indian:"印度料理", ramen:"拉麵", hotpot:"火鍋", hot_pot:"火鍋", taiwanese:"台式",
  barbecue:"燒烤", bbq:"燒烤", italian:"義式", vietnamese:"越式", pizza:"披薩", pasta:"義大利麵",
  curry:"咖哩", dumpling:"餃子", dumplings:"餃子", korean:"韓式", american:"美式", seafood:"海鮮",
  vegetarian:"素食", vegan:"純素", dessert:"甜點", cake:"蛋糕", ice_cream:"冰品", tea:"茶飲",
  fried_chicken:"炸雞", teppanyaki:"鐵板燒", waffle:"鬆餅", mexican:"墨西哥料理", french:"法式",
  donut:"甜甜圈", congee:"粥", salad:"沙拉", brunch:"早午餐", udon:"烏龍麵", fish:"魚料理",
  beef_noodle:"牛肉麵", rice:"飯食", soup:"湯品", bakery:"烘焙", pancake:"鬆餅", tapas:"小食",
  western:"西式", international:"異國料理", german:"德式", spanish:"西班牙料理", kebab:"沙威瑪",
  fried_food:"炸物", friture:"炸物", drink:"飲料", drinks:"飲料", shaved_ice:"剉冰", tofu:"豆花"};

function osmCat(am, cu){
  const has = re => re.test(cu);
  if(am === "bar" || am === "pub") return "酒吧";
  if(am === "ice_cream" || has(/bubble_tea|juice|drink|dessert|cake|ice_cream|shaved_ice|donut|waffle|tofu|豆花|冰|甜/)) return "甜點";
  if(am === "cafe") return has(/breakfast|brunch|sandwich/) ? "早午餐" : "咖啡";
  if(has(/breakfast|brunch|sandwich|早餐/)) return "早午餐";
  if(has(/japanese|sushi|ramen|udon|拉麵|壽司|日式|和風/)) return "日式";
  if(has(/salad|vegan|vegetarian|素食/)) return "健康餐";
  if(am === "fast_food" && has(/burger|pizza|chicken|fried|kebab/)) return "速食";
  if(am === "fast_food" || am === "food_court" ||
     has(/noodle|regional|taiwanese|local|dumpling|congee|rice|soup|便當|自助餐|麵|飯|粥|餃/)) return "小吃";
  return "餐廳";
}

const OH_DAY = {su:0, mo:1, tu:2, we:3, th:4, fr:5, sa:6};
/** 只認最常見的 opening_hours 寫法；看不懂就回 null，交給「營業時間未確認」。 */
function parseOH(raw){
  if(!raw) return null;
  const s = raw.trim().toLowerCase();
  if(s === "24/7") return {hrs:[{s:0, e:1440, a:1}], off:[]};
  const day = [null,null,null,null,null,null,null];
  for(const rule of s.split(";")){
    const r = rule.trim();
    if(!r) continue;
    const m = r.match(/^([a-z,\-\s]*?)\s*(off|closed|\d.*)$/);
    if(!m) return null;
    let days = [];
    const dp = m[1].trim();
    if(dp === "ph") continue;                       // 國定假日規則略過
    if(!dp) days = [0,1,2,3,4,5,6];
    else for(const tok of dp.split(",")){
      const ab = tok.trim().split("-").map(x => OH_DAY[x.trim()]);
      if(ab.some(x => x === undefined) || ab.length > 2) return null;
      if(ab.length === 1) days.push(ab[0]);
      else for(let d = ab[0]; ; d = (d + 1) % 7){ days.push(d); if(d === ab[1]) break; }
    }
    let spans = [];
    if(m[2] !== "off" && m[2] !== "closed"){
      for(const tok of m[2].split(",")){
        const t = tok.trim().match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})\+?$/);
        if(!t) return null;
        spans.push({s:+t[1]*60 + +t[2], e:+t[3]*60 + +t[4]});
      }
    }
    days.forEach(d => day[d] = spans);
  }
  const hrs = [], off = [];
  day.forEach((sp, d) => {
    if(!sp || !sp.length) off.push(d);
    else sp.forEach(x => hrs.push({s:x.s, e:x.e, d:[d], a:1}));   // a:1 → 只標「應該有開」
  });
  return hrs.length ? {hrs, off} : null;
}

function fromOsm(e){
  const t = e.tags || {};
  const lat = e.lat != null ? e.lat : e.center && e.center.lat;
  const lng = e.lon != null ? e.lon : e.center && e.center.lon;
  if(lat == null || !t.name) return null;
  const cu = (t.cuisine || "").toLowerCase();
  const sig = [...new Set(cu.split(/[;,]/).map(x => x.trim()).filter(Boolean)
    .map(x => CUISINE[x] || (/[^\x00-\x7f]/.test(x) ? x : "")).filter(Boolean))].join("、");
  const addr = t["addr:full"] ||
    (t["addr:street"] ? (t["addr:city"] || "") + (t["addr:district"] || "") + t["addr:street"]
      + (t["addr:housenumber"] ? t["addr:housenumber"] + (/號$/.test(t["addr:housenumber"]) ? "" : "號") : "") : "");
  const oh = parseOH(t.opening_hours);
  return {n:t.name, cat:osmCat(t.amenity, cu), sig, addr, lat, lng, osm:true,
          avg:null, flav:null, price:null, est:false, risk:false, been:null,
          queue:false, book:false, noCH:false,
          hrs:oh ? oh.hrs : null, off:oh ? oh.off : [], hrsTxt:t.opening_hours || "", offTxt:""};
}

async function fetchNear(pos, r){
  const q = '[out:json][timeout:25];nwr(around:' + r + ',' + pos.lat.toFixed(5) + ',' + pos.lng.toFixed(5)
    + ')[amenity~"^(restaurant|cafe|fast_food|food_court|bar|pub|ice_cream)$"][name];out center tags;';
  for(let i = 0; i < OVERPASS.length; i++){
    const base = OVERPASS[i];
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), i === 0 ? 25000 : 40000);   // 備援伺服器較慢，多等一點
    try{
      const res = await fetch(base + "?data=" + encodeURIComponent(q), {signal:ctl.signal});
      if(!res.ok) continue;
      const j = await res.json();
      if(j && Array.isArray(j.elements)) return j.elements;
    }catch(e){ /* 換下一台伺服器 */ }
    finally{ clearTimeout(timer); }
  }
  throw new Error("all overpass endpoints failed");
}

function nearStatus(r){
  return "附近 " + (r / 1000) + " 公里內找到 <b>" + NEAR.length + "</b> 家，資料來自 OpenStreetMap 社群地圖。"
    + "這些店沒有濃淡與價位，營業時間僅供參考。距離最遠抓到第 3 檔（約 3 公里）。";
}

async function loadNear(auto){
  if(S.src !== "near" || !S.pos) return;
  const r = NEAR_R[Math.min(S.dist, 3) - 1];
  const moved = !near.pos || straightKm(near.pos, S.pos) > 0.15;
  if(!moved && near.r >= r){ setStatus(nearStatus(near.r)); return; }
  const seq = ++near.seq;
  setStatus((auto ? "你離精選名單的店都超過 25 分鐘，改挑附近的店。" : "")
    + "正在找附近 " + (r / 1000) + " 公里內的店，通常 5 到 30 秒。");
  try{
    const els = await fetchNear(S.pos, r);
    if(seq !== near.seq) return;
    const seen = new Set();
    NEAR = els.map(fromOsm).filter(p => p && !seen.has(p.n + "|" + p.lat.toFixed(4) + p.lng.toFixed(4))
      && seen.add(p.n + "|" + p.lat.toFixed(4) + p.lng.toFixed(4)));
    near.pos = {lat:S.pos.lat, lng:S.pos.lng}; near.r = r;
    applyOrigin();
    if(S.src === "near"){ ACTIVE = NEAR; buildChips(); refresh(); setStatus(nearStatus(r)); }
  }catch(e){
    if(seq !== near.seq) return;
    setStatus("附近的店暫時抓不到，免費地圖伺服器有時會忙線。等半分鐘再按一次「附近所有店」。", true);
  }
}

function queueNear(){
  clearTimeout(near.timer);
  near.timer = setTimeout(() => loadNear(false), 500);
}

/* ══ 啟動 ══════════════════════════════════ */
MEAL.forEach(c => S.cats.add(c));
buildChips();
bindAxis("dist", $("ax-dist"), $("lab-dist"), $("tk-dist"));
bindAxis("flav", $("ax-flav"), $("lab-flav"), $("tk-flav"));
bindAxis("price", $("ax-price"), $("lab-price"), $("tk-price"));
["op-open","op-new","op-ch","op-quick","op-risk"].forEach(id => $(id).onchange = refresh);
$("roll").onclick = () => roll(false);
$("reroll").onclick = () => roll(true);
$("tab-dice").onclick = () => setMode("dice");
$("tab-list").onclick = () => setMode("list");
buildWhen();
document.querySelectorAll(".sort").forEach(b => b.onclick = () => {
  S.sort = b.dataset.s;
  document.querySelectorAll(".sort").forEach(x => x.classList.toggle("on", x === b));
  renderList();
});
$("foot").innerHTML = META.foot + GEO_NOTE;
$("org-home").onclick = useHome;
$("org-here").onclick = locate;
$("src-list").onclick = () => setSrc("list");
$("src-near").onclick = () => setSrc("near");
syncLocUI();
setStatus("距離以住家為圓心。按「我現在的位置」改用手機定位。");
refresh();
// 上次選了目前位置、而且權限已經給過，開頁就直接定位，不重複跳詢問
try{
  if(localStorage.getItem("wte-origin") === "here" && navigator.permissions)
    navigator.permissions.query({name:"geolocation"}).then(r => { if(r.state === "granted") locate(); }).catch(() => {});
}catch(e){}
